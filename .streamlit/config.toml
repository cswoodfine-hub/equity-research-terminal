# Streamlit's own chrome, in particular the canvas dataframe, takes its colours from
# here rather than from the injected stylesheet, so these values mirror the token set
# in frontend/assets/tokens.css and frontend/components/tokens.py.

[theme]
base = "dark"
primaryColor = "#4C9A7A"
backgroundColor = "#0C1417"
secondaryBackgroundColor = "#131E22"
textColor = "#E8EDEA"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
