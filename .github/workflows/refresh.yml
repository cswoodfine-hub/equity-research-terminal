name: Daily refresh

# The differentiator is accumulated snapshot history, and a missed day is a hole no
# source can backfill. This runs the whole-universe refresh on a schedule and commits
# the result back as newline-delimited JSON (the git-scraping pattern), which is both
# the schedule and an off-machine backup. The binary SQLite file is never committed;
# git stores the NDJSON deltas cleanly and the daily commit keeps the workflow from
# being disabled for inactivity.

on:
  schedule:
    # 06:00 UTC daily. Scheduled runners can start late under load, so nothing here
    # depends on the exact minute.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: "Fetch every source, ignoring every TTL (as a rebuilt run does)"
        type: boolean
        default: false

# One refresh at a time; a slow run must not overlap the next tick.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write        # to commit the refreshed history back

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # EDGAR blocks requests without a real identifier. Set this repo secret.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      # Optional: set to run the generated note; absent, the note stays rules-only.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it stands when the job starts, not the commit the run was
          # triggered on. A run queued behind another (the concurrency group above)
          # otherwise starts from before that run's history commit: on 2026-10-29 run
          # 105 waited out a manual run, checked out the older commit, and its push
          # conflicted with the history the manual run had just committed.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check the EDGAR identifier is set
        # Without it every SEC fetch fails and the run limps to a partial finish ten
        # minutes later, reporting a source error that reads like a network problem.
        # Better to say the one true thing immediately.
        run: |
          if [ -z "$(echo "$SEC_USER_AGENT" | tr -d '[:space:]')" ]; then
            echo "::error::SEC_USER_AGENT is empty. Add it under Settings > Secrets and"
            echo "::error::variables > Actions, named exactly SEC_USER_AGENT, with a value"
            echo "::error::such as: Novatalis Research you@example.com"
            exit 1
          fi
          echo "EDGAR identifier is set (${#SEC_USER_AGENT} characters)."

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore yesterday's database
        # From 2026-10-08 the run took an hour or more where it had taken 20 minutes,
        # because it began each day from history alone: the pharmacology lookups, the
        # drug codes and the Part D readers keep their data outside the export, so each
        # of them refetched everything every day. Starting from the database the last
        # run published lets the sources slower than daily skip inside their TTL. Every
        # daily source still fetches every run (fetchers/base.py), and Sunday fetches
        # everything. history.py restore-check accepts the file only if it is intact and
        # at least as recent as the committed history; otherwise it is removed and the
        # run below rebuilds and fetches every source, as before.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/restore"
          if gh release download data-latest --pattern 'er_tool.db.gz' \
               --dir "$RUNNER_TEMP/restore" --clobber; then
            gunzip -c "$RUNNER_TEMP/restore/er_tool.db.gz" > backend/er_tool.db || rm -f backend/er_tool.db
          else
            echo "No published database to restore; the run rebuilds from history."
          fi
          if python backend/history.py restore-check \
               && [ "${{ inputs.force_all }}" != "true" ]; then
            echo "ER_REFRESH_FORCE=daily" >> "$GITHUB_ENV"
          fi

      - name: Rebuild the database from committed history
        # The diff engine needs the prior snapshots to detect what changed. On a restored
        # database this merges the committed history into it (a row replaces the one
        # with its id); on none it builds the database from history alone. On the first
        # ever run data/history is empty and this is a harmless no-op.
        run: python backend/history.py rebuild

      - name: Seed the universe
        # Idempotent. The companies table is not in the export (it is reference data),
        # so it is re-seeded before the refresh and the diff read it.
        run: cd backend && python seed.py

      - name: Fetch the daily pulse
        # The daily biopharma pulse, a scheduled Claude run, commits each weekday's
        # briefing to claude/pulse-feed as data/pulse/YYYY-MM-DD.json. They are read into
        # a folder outside the working tree, so the history commit below never carries
        # them, and the refresh reads that folder (fetchers/news_pulse.py). No branch, or
        # no folder on it, is no pulse: the reader finds nothing and skips.
        run: |
          mkdir -p "$RUNNER_TEMP/pulse"
          if git fetch --depth=1 origin claude/pulse-feed; then
            git archive FETCH_HEAD data/pulse \
              | tar -x -C "$RUNNER_TEMP/pulse" --strip-components=2 \
              || echo "The pulse branch holds no data/pulse yet."
          else
            echo "No pulse branch yet."
          fi
          echo "ER_PULSE_DIR=$RUNNER_TEMP/pulse" >> "$GITHUB_ENV"
          echo "$(ls "$RUNNER_TEMP/pulse" | wc -l) pulse files; newest: $(ls "$RUNNER_TEMP/pulse" | tail -1)"

      - name: Refresh the universe
        # Prices from yfinance are often blocked from runner IPs; the fetcher fails
        # soft and the run finishes partial, which still advanced the fundamentals and
        # wrote the day's snapshots. A partial run exits 0 on purpose.
        run: python backend/scheduled_refresh.py

      - name: Export the refreshed history
        run: python backend/history.py export

      - name: Publish the database for the deployed app
        # The history export is the durable record and stays in git. The database
        # itself is 77 MB, 18 MB gzipped, and committing that daily would add six
        # gigabytes a year of undiffable binary. A release asset is replaced in place
        # instead, so the repository stays the size of its text and the deployed app
        # always finds one file at one tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f backend/er_tool.db ]; then
            echo "No database to publish; the refresh produced none."
            exit 0
          fi
          gzip -c backend/er_tool.db > er_tool.db.gz
          ls -lh er_tool.db.gz
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest \
            --title "Latest refreshed database" \
            --notes "Replaced by the daily refresh. The deployed app resolves this tag."
          gh release upload data-latest er_tool.db.gz --clobber

      - name: Commit the day's history
        # A bare push loses a race it is bound to lose eventually. On 2026-10-26 a human
        # pushed while the refresh was running, the push was rejected as non
        # fast-forward, and the step failed with the day's snapshots already exported:
        # the run went red, the database release went out, and the history that no
        # source can hand back again was left uncommitted until it was noticed.
        #
        #
        # A text rebase is the wrong tool for the retry. The export rewrites each file
        # whole from the database, so when another refresh has committed history
        # meanwhile both commits append to the same files and the rebase conflicts
        # (run 105, 2026-10-29). The database already holds this run's rows, so the
        # retry takes what landed, merges it into the database (a row replaces the one
        # with its id, as the rebuild step does) and exports again: a superset of both,
        # committed on top. The concurrency group keeps two runs from writing the same
        # ids, so the merge never trades this run's rows for another's.
        run: |
          git config user.name  "er-terminal-bot"
          git config user.email "actions@github.com"
          branch="${GITHUB_REF_NAME:-main}"
          commit_history() {
            git add data/history
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "chore(history): daily refresh $(date -u +%Y-%m-%d)"
          }
          if ! commit_history; then
            echo "No history changes to commit."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; merging what landed into the database and exporting again."
            sleep $((attempt * 5))
            git fetch origin "$branch" || continue
            git reset --hard "origin/$branch"
            python backend/history.py rebuild || exit 1
            python backend/history.py export || exit 1
            if ! commit_history; then
              echo "What landed already holds this run's history."
              exit 0
            fi
          done
          echo "::error::The day's history could not be pushed after three attempts."
          exit 1
