<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #wrap { position: relative; width: 100%; }
  #chart { width: 100%; }
  #draw { position: absolute; left: 0; top: 0; }
  #hint { position: absolute; left: 10px; top: 8px; z-index: 5; pointer-events: none;
          font: 11px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="wrap">
  <div id="chart"></div>
  <canvas id="draw"></canvas>
  <div id="hint"></div>
</div>
<script src="./lightweight-charts.standalone.production.js"></script>
<script>
/* ---- Streamlit component protocol (no build step) ---- */
function post(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type },
                                          extra || {}), "*");
}
const Streamlit = {
  ready() { post("streamlit:componentReady", { apiVersion: 1 }); },
  height(h) { post("streamlit:setFrameHeight", { height: h }); },
  value(v) { post("streamlit:setComponentValue", { value: v, dataType: "json" }); },
};

let chart = null, series = null, fairSeries = null, canvas, ctx, chartEl, hintEl;
const state = { data: [], markers: [], fair: [], mode: "Candlestick", intraday: false,
                lines: [], draw: false, theme: {}, viewKey: null, height: 560 };
let lastViewKey = null;
let pending = null;             // first click of a new line
let dragIdx = -1, dragEnd = null;   // an endpoint being dragged
let mouse = null;

function cloneLine(l) { return { t1: l.t1, p1: l.p1, t2: l.t2, p2: l.p2 }; }

window.addEventListener("message", function (e) {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  state.data = a.data || [];
  state.markers = a.markers || [];
  state.fair = a.fair || [];
  state.mode = a.mode || "Candlestick";
  state.intraday = !!a.intraday;
  state.lines = (a.lines || []).map(cloneLine);
  state.draw = !!a.draw_mode;
  state.theme = a.theme || {};
  state.viewKey = a.view_key || "";
  state.height = a.height || 560;
  state.gutter = a.gutter || BOTTOM_GUTTER;
  state.minHeight = state.height;
  render();
});

/* The chart is the whole subject of its tab, so it takes the room the tab has rather
   than a number chosen in Python that cannot know the screen. Python's height becomes
   the floor: on a short window, or where the parent cannot be measured, nothing moves.

   The frame is same-origin with the page that hosts it, so the parent's viewport and
   this frame's own offset in it are both readable. They are read inside a try: a
   browser that refuses the parent throws on the first access, and the floor stands. */
const BOTTOM_GUTTER = 56;        /* the legend and byline that sit under the chart */

function availableHeight() {
  /* Python says how much room the content under the chart needs, because the chart
     cannot see it: the frame ends at the legend. A constant here meant anything added
     below the chart went below the fold, which is how the first "why it moved" block
     rendered correctly and was never seen. */
  const gutter = state.gutter || BOTTOM_GUTTER;
  const floor = state.minHeight || 560;
  try {
    const frame = window.frameElement;
    if (!frame) return floor;
    const top = frame.getBoundingClientRect().top;
    const room = window.parent.innerHeight - top - gutter;
    return Math.max(floor, Math.round(room));
  } catch (e) {
    return floor;                /* cross-origin, or no parent to measure */
  }
}

function build() {
  const th = state.theme;
  chartEl.innerHTML = "";
  chart = LightweightCharts.createChart(chartEl, {
    height: state.height,
    layout: { background: { type: "solid", color: th.ground }, textColor: th.muted,
              fontSize: 10 },
    grid: { vertLines: { color: th.rule }, horzLines: { color: th.rule } },
    rightPriceScale: { borderColor: th.rule_strong },
    timeScale: { borderColor: th.rule_strong, rightOffset: 4,
                 timeVisible: state.intraday, secondsVisible: false },
    crosshair: { mode: 0, vertLine: { color: th.muted }, horzLine: { color: th.muted } },
    handleScroll: true, handleScale: true,
  });
  series = state.mode === "Candlestick"
    ? chart.addCandlestickSeries({ upColor: th.up, downColor: th.down,
        borderUpColor: th.up, borderDownColor: th.down,
        wickUpColor: th.up, wickDownColor: th.down })
    : chart.addLineSeries({ color: th.up, lineWidth: 2 });
  series.setData(state.data);
  if (state.markers.length) series.setMarkers(state.markers);
  fairSeries = null;             /* the old chart is gone, and its series with it */
  syncFair();
  chart.timeScale().fitContent();
  chart.timeScale().subscribeVisibleLogicalRangeChange(drawLines);
}

/* The fair value this book stated, on the same scale as the price, because the gap
   between the two lines is the whole point of drawing them together.

   Stepped rather than sloped: the model held its view between the days it stated one,
   and a slope would draw a daily rebuild that never happened. The step colour rides on
   each point (Python sends the muted token for a carried day), so the line itself says
   which days were stated and which were held. */
function syncFair() {
  if (!state.fair.length) {
    if (fairSeries) { chart.removeSeries(fairSeries); fairSeries = null; }
    return;
  }
  if (!fairSeries) {
    fairSeries = chart.addLineSeries({
      color: state.theme.flag, lineWidth: 2,
      lineType: 1,                 /* LineType.WithSteps */
      priceLineVisible: false, crosshairMarkerVisible: false,
      lastValueVisible: true, title: "fair value",
    });
  } else {
    fairSeries.applyOptions({ color: state.theme.flag });
  }
  fairSeries.setData(state.fair);
}

function render() {
  state.height = availableHeight();
  if (!chart || state.viewKey !== lastViewKey) {
    lastViewKey = state.viewKey;
    build();
  } else {
    series.setData(state.data);      // same view: update in place, keep the pan/zoom
    series.setMarkers(state.markers);
    syncFair();
  }
  // Grid colour is re-applied on every render, not only on build: toggling the grid
  // changes the theme without changing the view key, and a rebuild would throw away
  // the pan and zoom the analyst has set.
  chart.applyOptions({
    width: chartEl.clientWidth,
    height: state.height,          // the tab may have resized since the chart was built
    grid: { vertLines: { color: state.theme.rule },
            horzLines: { color: state.theme.rule } },
  });
  canvas.style.pointerEvents = state.draw ? "auto" : "none";   // else the chart pans
  canvas.style.cursor = state.draw ? "crosshair" : "default";
  hintEl.style.color = state.theme.muted || "#7E9098";
  hintEl.textContent = state.draw
    ? "Draw: click two points for a line · drag an end to move · double-click a line to delete"
    : "";
  sizeCanvas();
  Streamlit.height(state.height + 2);
}

function sizeCanvas() {
  const w = chartEl.clientWidth, h = state.height;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawLines();
}

/* ---- coordinates ---- */
function toX(t) { return chart.timeScale().timeToCoordinate(t); }
function toY(p) { return series.priceToCoordinate(p); }
function fromX(x) { return chart.timeScale().coordinateToTime(x); }
function fromY(y) { return series.coordinateToPrice(y); }

function drawLines() {
  if (!ctx) return;
  const w = chartEl.clientWidth, h = state.height, th = state.theme;
  ctx.clearRect(0, 0, w, h);
  for (const L of state.lines) {
    const x1 = toX(L.t1), y1 = toY(L.p1), x2 = toX(L.t2), y2 = toY(L.p2);
    if (x1 == null || y1 == null || x2 == null || y2 == null) continue;
    ctx.strokeStyle = th.flag; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (state.draw) {
      for (const pt of [[x1, y1], [x2, y2]]) {
        ctx.fillStyle = th.flag;
        ctx.beginPath(); ctx.arc(pt[0], pt[1], 4, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  if (pending && mouse) {
    const x1 = toX(pending.t), y1 = toY(pending.p);
    if (x1 != null && y1 != null) {
      ctx.strokeStyle = th.flag; ctx.setLineDash([4, 3]); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function endpointHit(x, y) {
  for (let i = 0; i < state.lines.length; i++) {
    const L = state.lines[i];
    const ax = toX(L.t1), ay = toY(L.p1), bx = toX(L.t2), by = toY(L.p2);
    if (ax != null && ay != null && Math.hypot(x - ax, y - ay) < 8) return { idx: i, end: "a" };
    if (bx != null && by != null && Math.hypot(x - bx, y - by) < 8) return { idx: i, end: "b" };
  }
  return null;
}
function lineHit(x, y) {
  for (let i = 0; i < state.lines.length; i++) {
    const L = state.lines[i];
    const ax = toX(L.t1), ay = toY(L.p1), bx = toX(L.t2), by = toY(L.p2);
    if (ax == null || bx == null || ay == null || by == null) continue;
    if (segDist(x, y, ax, ay, bx, by) < 6) return i;
  }
  return -1;
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  let t = ((px - ax) * dx + (py - ay) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function commit() { Streamlit.value(state.lines.map(cloneLine)); }

function localXY(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
function onDown(ev) {
  if (!state.draw) return;
  const m = localXY(ev);
  const hit = endpointHit(m.x, m.y);
  if (hit) { dragIdx = hit.idx; dragEnd = hit.end; ev.preventDefault(); return; }
  const t = fromX(m.x), p = fromY(m.y);
  if (t == null || p == null) return;
  if (!pending) { pending = { t: t, p: p }; }
  else {
    state.lines.push({ t1: pending.t, p1: pending.p, t2: t, p2: p });
    pending = null; drawLines(); commit();
  }
}
function onMove(ev) {
  mouse = localXY(ev);
  if (dragIdx >= 0) {
    const t = fromX(mouse.x), p = fromY(mouse.y);
    if (t != null && p != null) {
      const L = state.lines[dragIdx];
      if (dragEnd === "a") { L.t1 = t; L.p1 = p; } else { L.t2 = t; L.p2 = p; }
    }
  }
  if (state.draw) drawLines();
}
function onUp() { if (dragIdx >= 0) { dragIdx = -1; dragEnd = null; commit(); } }
function onDbl(ev) {
  if (!state.draw) return;
  const m = localXY(ev);
  const i = lineHit(m.x, m.y);
  if (i >= 0) { state.lines.splice(i, 1); pending = null; drawLines(); commit(); }
}

window.addEventListener("load", function () {
  chartEl = document.getElementById("chart");
  canvas = document.getElementById("draw");
  ctx = canvas.getContext("2d");
  hintEl = document.getElementById("hint");
  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("dblclick", onDbl);
  // The window changing shape changes how much room the tab has, so the height is
  // re-measured with the width rather than held at whatever the last render found.
  window.addEventListener("resize", function () {
    if (!chart) return;
    state.height = availableHeight();
    chart.applyOptions({ width: chartEl.clientWidth, height: state.height });
    sizeCanvas();
    Streamlit.height(state.height + 2);
  });
  Streamlit.ready();
});
</script>
</body>
</html>
