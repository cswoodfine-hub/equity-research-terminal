<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* An iframe inherits none of the host page's CSS: colour, family and size are set here
     and the frame's own stylesheet arrives with the render call. */
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    color: var(--text); font-family: var(--font-ui); font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  [data-gate], [data-more], .ca-ar { cursor: pointer; }
  [data-gate]:focus-visible, [data-more]:focus-visible { outline: 1px solid var(--muted);
    outline-offset: 1px; }
</style>
<style id="frame"></style>
</head>
<body>
<div id="b"></div>
<script>
function post(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type },
                                          extra || {}), "*");
}
const Streamlit = {
  ready() { post("streamlit:componentReady", { apiVersion: 1 }); },
  height(h) { post("streamlit:setFrameHeight", { height: h }); },
  value(v) { post("streamlit:setComponentValue", { value: v, dataType: "json" }); },
};

let wired = false;
let fontsCopied = false;
let lastHeight = 0;
let lastMarkup = null;
let openArea = null;      // the area row open in the table; kept across reruns

function copyFontFaces() {
  // The host bundles its fonts as @font-face rules with base64 sources. The iframe is
  // same-origin, so the rules are copied across rather than shipping the binaries twice.
  // On any failure the font stack falls back to the system sans.
  if (fontsCopied) return;
  fontsCopied = true;
  try {
    let faces = "";
    const sheets = window.parent.document.styleSheets;
    for (let i = 0; i < sheets.length; i++) {
      let rules;
      try { rules = sheets[i].cssRules; } catch (e) { continue; }
      if (!rules) continue;
      for (let j = 0; j < rules.length; j++) {
        if (rules[j].type === 5 /* CSSRule.FONT_FACE_RULE */) faces += rules[j].cssText + "\n";
      }
    }
    if (faces) {
      const style = document.createElement("style");
      style.textContent = faces;
      document.head.appendChild(style);
    }
  } catch (e) { /* no access: the fallback stack stands */ }
}

function fit() {
  const b = document.getElementById("b");
  const h = Math.ceil(b.getBoundingClientRect().height) + 2;
  if (h !== lastHeight) { lastHeight = h; Streamlit.height(h); }
}

function fill() {
  // The area page fills the screen: its height is the room the app's scroller leaves
  // above and below the frame, read from the parent page (same origin). Narrower than
  // 1180 px, or when the parent cannot be read, the page takes its own height.
  const page = document.querySelector(".ca-page");
  if (page) {
    let h = null;
    try {
      const fe = window.frameElement;
      const pd = window.parent.document;
      const main = pd.querySelector('[data-testid="stMain"]');
      const bc = pd.querySelector('[data-testid="stMainBlockContainer"]');
      if (fe && main && bc && window.innerWidth >= 1180) {
        const fr = fe.getBoundingClientRect(), mr = main.getBoundingClientRect();
        const above = fr.top - mr.top + main.scrollTop;
        const below = bc.getBoundingClientRect().bottom - fr.bottom;
        h = Math.max(520, Math.floor(main.clientHeight - above - below) - 4);
      }
    } catch (e) { h = null; }
    if (h) page.style.setProperty("--ca-h", h + "px");
    else page.style.removeProperty("--ca-h");
  }
  fit();
}

function setOpen(name) {
  // One area open at a time; the others fold to one line. Client side: no rerun.
  openArea = name;
  const rows = document.querySelector(".ca-rows");
  if (!rows) return;
  let any = false;
  rows.querySelectorAll(".ca-row").forEach(function (r) {
    const on = name !== null && r.getAttribute("data-area") === name;
    r.classList.toggle("open", on);
    const ar = r.querySelector(".ca-ar");
    if (ar) ar.setAttribute("aria-expanded", on ? "true" : "false");
    any = any || on;
  });
  rows.classList.toggle("has-open", any);
  if (!any) openArea = null;
}

function showView(btn) {
  // The range chart's two views share one grid cell: the switch flips which is visible
  // and never changes the frame's height.
  const wrap = btn.closest(".cx-frame");
  if (!wrap || btn.disabled) return;
  const want = btn.getAttribute("data-view");
  wrap.querySelectorAll(".cx-vb").forEach(function (b) {
    b.classList.toggle("on", b.getAttribute("data-view") === want);
  });
  wrap.querySelectorAll(".cx-rv").forEach(function (v) {
    v.classList.toggle("off", v.getAttribute("data-view") !== want);
  });
}

function fire(target, ev) {
  const view = target.closest(".cx-vb");
  if (view) { showView(view); return; }
  const gate = target.closest("[data-gate]");
  if (gate) {
    if (ev) ev.preventDefault();
    const where = gate.closest(".cx-tl") ? "the timeline"
      : gate.closest(".ca-nx") ? "next up"
      : gate.closest(".ca-gl") ? "the open area" : "the bars";
    Streamlit.value({ gate: gate.getAttribute("data-gate"), from: where, nonce: Date.now() });
    return;
  }
  const more = target.closest("[data-more]");
  if (more) {
    if (ev) ev.preventDefault();
    Streamlit.value({ more: more.getAttribute("data-more"),
                      area: more.getAttribute("data-area"), nonce: Date.now() });
    return;
  }
  const ar = target.closest(".ca-ar");
  if (ar) {
    const name = ar.closest(".ca-row").getAttribute("data-area");
    setOpen(openArea === name ? null : name);
  }
}

window.addEventListener("message", function (e) {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  const tk = a.tokens || {};
  const root = document.documentElement;
  // The page's custom properties do not cross into the iframe; the token values are
  // passed in and set here, so tokens.py stays the one source.
  Object.keys(tk).forEach(function (k) { root.style.setProperty("--" + k, tk[k]); });
  copyFontFaces();
  const b = document.getElementById("b");
  if (a.markup !== lastMarkup) {
    // A rerun that hands the same markup leaves the frame as it is: the open area stays.
    lastMarkup = a.markup;
    document.getElementById("frame").textContent = a.css || "";
    b.innerHTML = a.markup || "";
    b.querySelectorAll("[data-gate], [data-more], .ca-ar").forEach(function (el) {
      el.setAttribute("tabindex", "0");
      el.setAttribute("role", "button");
    });
    if (openArea !== null) setOpen(openArea);
  }
  requestAnimationFrame(fill);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fill);

  if (!wired) {
    wired = true;
    if (window.ResizeObserver) new ResizeObserver(fit).observe(b);
    try { window.parent.addEventListener("resize", fill); } catch (err) { /* no access */ }
    b.addEventListener("click", function (ev) { fire(ev.target, ev); });
    b.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fire(ev.target, ev); }
    });
  }
});
Streamlit.ready();
</script>
</body>
</html>
