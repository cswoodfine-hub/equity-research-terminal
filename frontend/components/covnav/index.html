<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #c { width: 100%; }
  #c svg { width: 100%; height: auto; display: block; }
  #c a { cursor: pointer; }
</style>
</head>
<body>
<div id="c"></div>
<script>
function post(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type },
                                          extra || {}), "*");
}
const Streamlit = {
  ready() { post("streamlit:componentReady", { apiVersion: 1 }); },
  height(h) { post("streamlit:setFrameHeight", { height: h }); },
  value(v) { post("streamlit:setComponentValue", { value: v, dataType: "json" }); },
};

let wired = false;

function goToInsights() {
  // Same-origin parent, so its tab buttons are reachable; click the Key insights tab.
  try {
    const tabs = window.parent.document.querySelectorAll('button[data-baseweb="tab"]');
    for (const t of tabs) {
      if ((t.textContent || "").trim() === "Key insights") { t.click(); return true; }
    }
  } catch (e) { /* cross-origin or DOM change: fall back to just selecting the company */ }
  return false;
}

window.addEventListener("message", function (e) {
  const d = e.data;
  if (!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  const c = document.getElementById("c");
  c.style.setProperty("--muted", a.muted || "#7E9098");
  c.innerHTML = a.svg || "";
  const styleId = "covnav-hover";
  if (!document.getElementById(styleId)) {
    const s = document.createElement("style");
    s.id = styleId;
    s.textContent = "#c a:hover rect { stroke: " + (a.muted || "#7E9098") +
                    "; stroke-width: 1; }";
    document.head.appendChild(s);
  }
  requestAnimationFrame(function () {
    const el = c.querySelector("svg");
    Streamlit.height(el ? Math.ceil(el.getBoundingClientRect().height) + 6 : 430);
  });
  if (!wired) {
    wired = true;
    c.addEventListener("click", function (ev) {
      const anchor = ev.target.closest("a");
      if (!anchor) return;
      ev.preventDefault();
      let ticker = anchor.getAttribute("data-ticker");
      if (!ticker) {
        try {
          ticker = new URL(anchor.getAttribute("href"), location.href)
            .searchParams.get("ticker");
        } catch (err) { ticker = null; }
      }
      if (!ticker) return;
      goToInsights();
      Streamlit.value({ ticker: ticker, nonce: Date.now() });
    });
  }
});
Streamlit.ready();
</script>
</body>
</html>
